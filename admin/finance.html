<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Finance Review Dashboard</title>
<style>
  :root { --primary: #1a6b3c; --danger: #b91c1c; --bg: #f3f4f6; --card: #fff; --border: #e2e5e4; --muted: #6b7280; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; }
  .layout { display: flex; height: 100vh; }
  .sidebar { width: 360px; border-right: 1px solid var(--border); background: var(--card); overflow-y: auto; }
  .main { flex: 1; overflow-y: auto; padding: 20px; }
  .queue-item { padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .queue-item:hover { background: #f9fafb; }
  .queue-item.active { background: #eef7f0; border-left: 3px solid var(--primary); }
  .queue-item .sub-id { font-weight: 600; }
  .queue-item .meta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .risk-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
  .risk-low { background: #dcfce7; color: #166534; }
  .risk-med { background: #fef3c7; color: #92400e; }
  .risk-high { background: #fee2e2; color: #991b1b; }
  .device-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 600; margin-left: 4px; }
  .device-shared { background: #fce7f3; color: #9d174d; }
  .device-repeat { background: #e0e7ff; color: #3730a3; }
  .device-single { background: #f3f4f6; color: #4b5563; }
  .review-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .panel h3 { margin: 0 0 10px; font-size: 1rem; }
  #billImage { width: 100%; border-radius: 8px; border: 1px solid var(--border); }
  .metric-row { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 5px 0; border-bottom: 1px solid #f0f0f0; }
  .flag-chip { display: inline-block; background: #fee2e2; color: #991b1b; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; margin: 2px 4px 2px 0; }
  .item-line { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
  .item-line input { width: 70px; padding: 6px; border: 1px solid var(--border); border-radius: 6px; }
  .total-line { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.1rem; margin-top: 10px; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .btn-approve { background: var(--primary); color: #fff; }
  .btn-reject { background: var(--danger); color: #fff; }
  .btn-save { background: #374151; color: #fff; }
  .btn-secondary { background: #e5e7eb; color: #111; border: 1px solid var(--border); }
  #loginOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; }
  #loginBox { background: #fff; padding: 24px; border-radius: 12px; width: 300px; }
  #loginBox input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; }
  #loginBox button { width: 100%; padding: 10px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  select#rejectionCode { width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 6px; border: 1px solid var(--border); }
  .app-header {
    background: var(--primary); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 14px;
  }
  .app-header h2 { margin: 0; font-size: 1.05rem; font-weight: 700; }
  .app-header nav { display: flex; gap: 14px; margin-left: 20px; }
  .app-header nav a { color: #fff; opacity: 0.85; text-decoration: none; font-size: 0.9rem; }
  .app-header nav a.active { opacity: 1; font-weight: 700; border-bottom: 2px solid #fff; }
  .app-header .spacer { flex: 1; }
  .app-header .who { font-size: 0.85rem; opacity: 0.9; margin-right: 10px; }
  .app-header button.logout { background: rgba(255,255,255,0.15); color: #fff; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .top-customers-panel { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .top-customers-panel h4 { margin: 0 0 8px; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; }
  .top-customer-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 4px 0; }
  .payout-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .payout-card .bank-info { background: #f9fafb; border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 0.9rem; }
  .payout-card input { padding: 9px; border: 1px solid var(--border); border-radius: 8px; margin-right: 8px; margin-bottom: 8px; width: 220px; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .cust-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 0.9rem; }
  .cust-grid .label { color: var(--muted); font-size: 0.8rem; }
  .device-card { background: #f9fafb; border-radius: 8px; padding: 10px; margin-top: 8px; font-size: 0.85rem; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

<div id="loginOverlay">
  <div id="loginBox">
    <h3>Finance Login</h3>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button id="loginBtn">Sign In</button>
    <div id="loginError" style="color:red;font-size:0.85rem;margin-top:6px;"></div>
  </div>
</div>

<div class="layout" style="display:none;flex-direction:column;" id="mainLayout">
  <div class="app-header">
    <h2>💰 Finance Dashboard <span style="font-size:0.7rem;opacity:0.75;font-weight:500;">v2026-09-24b</span></h2>
    <nav>
      <a href="#" id="navQueue" class="active">Review Queue</a>
      <a href="#" id="navPayouts" style="display:none;">Payouts</a>
      <a href="/index.html">Admin Panel →</a>
    </nav>
    <div class="spacer"></div>
    <span class="who" id="whoLabel"></span>
    <button class="logout" id="logoutBtn">Log out</button>
  </div>
  <div style="display:flex;flex:1;min-height:0;">
    <div class="sidebar" id="queueSidebar">
      <div class="top-customers-panel" id="topCustomersPanel"></div>
      <div id="queueList"></div>
    </div>
    <div class="main" id="reviewPanel">
      <div class="panel">Select a submission from the queue to begin review.</div>
    </div>
  </div>
</div>

<script src="/config.js"></script>
<script>
const API_BASE = window.API_BASE || "";
let token = localStorage.getItem("financeToken") || null;
let role = localStorage.getItem("financeRole") || null;
let currentId = null;
let lastPayouts = [];

document.getElementById("loginBtn").addEventListener("click", async () => {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const res = await fetch(`${API_BASE}/api/auth/login`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();
  if (!res.ok) { document.getElementById("loginError").textContent = data.error; return; }
  if (data.role !== "finance_staff" && data.role !== "finance_lead") {
    document.getElementById("loginError").textContent = "This account does not have Finance access.";
    return;
  }
  token = data.token;
  role = data.role;
  localStorage.setItem("financeToken", token);
  localStorage.setItem("financeRole", role);
  localStorage.setItem("financeUsername", username);
  showApp();
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("financeToken");
  localStorage.removeItem("financeRole");
  localStorage.removeItem("financeUsername");
  location.reload();
});

function showApp() {
  document.getElementById("loginOverlay").style.display = "none";
  document.getElementById("mainLayout").style.display = "flex";
  document.getElementById("whoLabel").textContent = `${localStorage.getItem("financeUsername") || ""} (${role.replace("_", " ")})`;

  if (role === "finance_lead") {
    document.getElementById("navPayouts").style.display = "inline";
  }
  document.getElementById("navQueue").addEventListener("click", (e) => { e.preventDefault(); showQueueView(); });
  document.getElementById("navPayouts").addEventListener("click", (e) => { e.preventDefault(); showPayoutsView(); });

  loadTopCustomers();
  loadQueue();
  checkApiVersion();
}

async function checkApiVersion() {
  try {
    const res = await fetch(`${API_BASE}/api/version`);
    const data = await res.json();
    const el = document.getElementById("whoLabel");
    if (el && data.apiVersion) {
      el.textContent = (el.textContent || "") + " · API " + data.apiVersion;
    }
    if (!String(data.apiVersion || "").includes("2026-09-24")) {
      console.warn("Worker API is OLD — redeploy Worker with src/index.ts + src/extras.ts", data);
    }
  } catch (e) {
    console.warn("Could not reach /api/version — Worker may be old or URL wrong", e);
  }
}


function setActiveNav(id) {
  document.querySelectorAll(".app-header nav a").forEach(a => a.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function showQueueView() {
  setActiveNav("navQueue");
  document.getElementById("queueSidebar").style.display = "block";
  loadQueue();
}

function showPayoutsView() {
  setActiveNav("navPayouts");
  document.getElementById("queueSidebar").style.display = "block";
  loadPayouts();
}

function authHeaders() {
  return { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" };
}

function deviceClsLabel(subs, mobiles) {
  if (mobiles >= 2) return { cls: "device-shared", text: `SHARED · ${subs} claims · ${mobiles} mobiles` };
  if (subs >= 2) return { cls: "device-repeat", text: `REPEAT · ${subs} claims` };
  return { cls: "device-single", text: "Single use" };
}

async function loadTopCustomers() {
  const res = await fetch(`${API_BASE}/api/top-customers?limit=5`, { headers: authHeaders() });
  if (!res.ok) return;
  const data = await res.json();
  const panel = document.getElementById("topCustomersPanel");
  panel.innerHTML = `
    <h4>Top Submitted Customers</h4>
    ${(data.customers || []).map(cust => `
      <div class="top-customer-row">
        <span>${cust.dealer_name || cust.mobile_number}</span>
        <span>${cust.submission_count} claims</span>
      </div>
    `).join("") || '<div class="muted">No submissions yet.</div>'}
  `;
}

async function loadQueue() {
  const res = await fetch(`${API_BASE}/api/finance/queue?status=PENDING`, { headers: authHeaders() });
  if (res.status === 401) { localStorage.removeItem("financeToken"); location.reload(); return; }
  const data = await res.json();
  const list = document.getElementById("queueList");
  list.innerHTML = (data.submissions || []).map(s => {
    const riskClass = s.risk_score >= 60 ? "risk-high" : s.risk_score >= 25 ? "risk-med" : "risk-low";
    const d = deviceClsLabel(s.device_submissions || 1, s.device_mobiles || 1);
    return `
      <div class="queue-item" data-id="${s.id}">
        <div class="sub-id">${s.id}
          <span class="device-badge ${d.cls}" title="Device usage">${d.text}</span>
        </div>
        <div class="meta">${s.dealer_name || "Unknown dealer"} · ${s.mobile_number}</div>
        <div class="meta">${new Date(s.created_at_server).toLocaleString()}</div>
        <span class="risk-badge ${riskClass}">Risk ${s.risk_score}</span>
      </div>`;
  }).join("") || `<div style="padding:16px;color:var(--muted);">Queue is empty.</div>`;

  list.querySelectorAll(".queue-item").forEach(el => {
    el.addEventListener("click", () => {
      list.querySelectorAll(".queue-item").forEach(x => x.classList.remove("active"));
      el.classList.add("active");
      loadSubmission(el.dataset.id);
    });
  });
}

async function loadSubmission(id) {
  currentId = id;
  const res = await fetch(`${API_BASE}/api/finance/submissions/${id}`, { headers: authHeaders() });
  const data = await res.json();
  renderReview(data);
  loadBillImage(id);
}

async function loadBillImage(id) {
  const res = await fetch(`${API_BASE}/api/finance/submissions/${id}/image`, { headers: authHeaders() });
  if (!res.ok) return;
  const blob = await res.blob();
  const img = document.getElementById("billImage");
  if (img) img.src = URL.createObjectURL(blob);
}

function renderReview(data) {
  const s = data.submission;
  const flags = (s.fraud_flags || "").split(",").filter(Boolean);
  const riskClass = s.risk_score >= 60 ? "risk-high" : s.risk_score >= 25 ? "risk-med" : "risk-low";
  const device = data.device || {};
  const act = device.activity || {};
  const sum = device.summary || {};
  const dBadge = deviceClsLabel(act.total || 1, act.mobiles || 1);
  const cust = data.customer || {};
  const stats = cust.stats || {};
  const wallet = cust.wallet || {};
  const bank = cust.bank;

  const itemRows = (data.items || []).map(i => `
    <div class="item-line">
      <span>${i.name}</span>
      <span style="color:var(--muted);font-size:0.85rem;">Claimed: ${i.claimed_qty}</span>
      <input type="number" min="0" value="${i.verified_qty ?? i.claimed_qty}" data-item-id="${i.id}" data-rate="${i.rate_lkr_snapshot}" class="verified-qty-input" />
    </div>
  `).join("");

  const recentHtml = (cust.recent || []).slice(0, 5).map(r =>
    `<div class="metric-row"><span>${r.id}</span><span>${r.status} · LKR ${(r.total_approved_reward_lkr || r.total_claimed_reward_lkr || 0).toFixed(0)}</span></div>`
  ).join("") || '<div class="muted">No history</div>';

  const devicesHtml = (cust.devices || []).map(d =>
    `<div class="metric-row"><span>${d.label || d.hash?.slice(0, 10)}</span><span>${d.claims} claims</span></div>`
  ).join("") || '<div class="muted">—</div>';

  document.getElementById("reviewPanel").innerHTML = `
    <div class="review-grid">
      <div>
        <div class="panel">
          <h3>Uploaded Invoice — ${s.id}</h3>
          <img id="billImage" alt="Bill" />
        </div>
        <div class="panel">
          <h3>Customer Profile · ${s.mobile_number}</h3>
          <div class="cust-grid">
            <div><div class="label">Total claims</div><div><b>${stats.total ?? 0}</b></div></div>
            <div><div class="label">Approved / Rejected / Pending</div><div>${stats.approved ?? 0} / ${stats.rejected ?? 0} / ${stats.pending ?? 0}</div></div>
            <div><div class="label">Approved LKR</div><div><b>${Number(stats.approved_lkr || 0).toFixed(2)}</b></div></div>
            <div><div class="label">Wallet balance</div><div><b>${Number(wallet.balance_lkr || 0).toFixed(2)}</b> <span class="muted">(${wallet.status || "ACTIVE"})</span></div></div>
            <div><div class="label">Paid out</div><div>${cust.paidOut ? `LKR ${Number(cust.paidOut.total || 0).toFixed(2)} (${cust.paidOut.n || 0} txns)` : "—"}</div></div>
            <div><div class="label">First / last claim</div><div class="muted">${stats.first_claim ? new Date(stats.first_claim).toLocaleDateString() : "—"} → ${stats.last_claim ? new Date(stats.last_claim).toLocaleDateString() : "—"}</div></div>
          </div>
          ${bank ? `<div style="margin-top:10px;font-size:0.9rem;"><b>Bank:</b> ${bank.account_name} · ${bank.bank_name}${bank.branch_name ? " (" + bank.branch_name + ")" : ""} · ${bank.account_number}</div>` : '<div class="muted" style="margin-top:8px;">No bank details on file yet.</div>'}
          <div style="margin-top:12px;"><div class="label" style="margin-bottom:4px;">Recent claims</div>${recentHtml}</div>
          <div style="margin-top:10px;"><div class="label" style="margin-bottom:4px;">Devices used by this mobile</div>${devicesHtml}</div>
        </div>
      </div>
      <div>
        <div class="panel">
          <h3>Telemetry &amp; Anti-Fraud Card</h3>
          <div class="metric-row"><span>Customer Mobile</span><span>${s.mobile_number}</span></div>
          <div class="metric-row"><span>Dealer</span><span>${s.dealer_name || "Unknown"}${s.dealer_city ? " · " + s.dealer_city : ""}</span></div>
          <div class="metric-row"><span>Dealer Distance</span><span>${s.dealer_distance_km != null ? s.dealer_distance_km.toFixed(2) + " km" : "N/A"}</span></div>
          <div class="metric-row"><span>Time Delta</span><span>${Math.round(s.time_delta_seconds || 0)}s</span></div>
          <div class="metric-row"><span>Risk Score</span><span class="risk-badge ${riskClass}">${s.risk_score}/100</span></div>
          <div style="margin-top:8px;">${flags.map(f => `<span class="flag-chip">${f}</span>`).join("") || '<span class="muted">No flags</span>'}</div>

          <div class="device-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <b>Device blueprint</b>
              <span class="device-badge ${dBadge.cls}">${dBadge.text}</span>
            </div>
            <div class="metric-row"><span>Device</span><span>${sum.label || "Unknown"}</span></div>
            <div class="metric-row"><span>OS / Browser</span><span>${sum.os || "—"} ${sum.osVersion || ""} · ${sum.browser || "—"}</span></div>
            <div class="metric-row"><span>Screen</span><span>${sum.screen || "—"}</span></div>
            <div class="metric-row"><span>GPU</span><span style="max-width:55%;text-align:right;overflow:hidden;text-overflow:ellipsis;">${sum.gpu || "—"}</span></div>
            <div class="metric-row"><span>Cores / Memory</span><span>${sum.cores ?? "—"} / ${sum.memoryGb ?? "—"} GB</span></div>
            <div class="metric-row"><span>Network</span><span>${sum.network || sum.language || "—"}</span></div>
            <div class="metric-row"><span>Fingerprint</span><span style="font-family:monospace;font-size:0.75rem;">${(device.fingerprint || "").slice(0, 16)}…</span></div>
            <div class="metric-row"><span>Device history</span><span>${act.approved || 0} approved · ${act.rejected || 0} rejected · ${act.pending || 0} pending</span></div>
            ${act.mobiles >= 2 ? `<div style="color:var(--danger);margin-top:6px;font-weight:600;">⚠ This device has been used by ${act.mobiles} different mobile numbers.</div>` : ""}
            ${act.total >= 2 && act.mobiles < 2 ? `<div style="color:#92400e;margin-top:6px;">This device has submitted ${act.total} claims (same mobile).</div>` : ""}
          </div>
        </div>
        <div class="panel">
          <h3>Item Verification &amp; Reward</h3>
          ${itemRows}
          <div class="total-line"><span>Total</span><span id="calcTotal">—</span></div>
          <button class="btn btn-save" id="saveQtyBtn" style="width:100%;margin-top:10px;">Save Verified Quantities</button>
        </div>
        <div class="panel">
          <select id="rejectionCode">
            <option value="">Select rejection reason (if rejecting)</option>
            <option value="ILLEGIBLE_BILL">Illegible bill image</option>
            <option value="QTY_MISMATCH">Quantity mismatch</option>
            <option value="GEOGRAPHIC_MISMATCH">Geographic mismatch</option>
            <option value="DUPLICATE_BILL_IMAGE">Duplicate bill image</option>
            <option value="OTHER">Other</option>
          </select>
          <div class="actions">
            <button class="btn btn-approve" id="approveBtn">Approve &amp; Credit</button>
            <button class="btn btn-reject" id="rejectBtn">Reject Claim</button>
          </div>
        </div>
      </div>
    </div>
  `;

  recalcTotal();
  document.querySelectorAll(".verified-qty-input").forEach(inp => inp.addEventListener("input", recalcTotal));
  document.getElementById("saveQtyBtn").addEventListener("click", saveVerifiedQuantities);
  document.getElementById("approveBtn").addEventListener("click", approveSubmission);
  document.getElementById("rejectBtn").addEventListener("click", rejectSubmission);
}

function recalcTotal() {
  let total = 0;
  document.querySelectorAll(".verified-qty-input").forEach(inp => {
    total += (parseFloat(inp.value) || 0) * parseFloat(inp.dataset.rate);
  });
  const el = document.getElementById("calcTotal");
  if (el) el.textContent = `LKR ${total.toFixed(2)}`;
}

function collectItems() {
  return [...document.querySelectorAll(".verified-qty-input")].map(inp => ({
    itemId: parseInt(inp.dataset.itemId, 10),
    verifiedQty: parseInt(inp.value, 10) || 0
  }));
}

async function saveVerifiedQuantities() {
  await fetch(`${API_BASE}/api/finance/submissions/${currentId}/verify`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ items: collectItems() })
  });
  alert("Verified quantities saved.");
}

async function approveSubmission() {
  await saveVerifiedQuantities();
  const res = await fetch(`${API_BASE}/api/finance/submissions/${currentId}/approve`, {
    method: "POST", headers: authHeaders()
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error || "Approve failed"); return; }
  alert(`Approved. Total credited: LKR ${data.totalApproved?.toFixed(2)}`);
  loadQueue();
  document.getElementById("reviewPanel").innerHTML = `<div class="panel">Select a submission from the queue to begin review.</div>`;
}

async function rejectSubmission() {
  const rejectionCode = document.getElementById("rejectionCode").value;
  if (!rejectionCode) { alert("Please select a rejection reason."); return; }
  await fetch(`${API_BASE}/api/finance/submissions/${currentId}/reject`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ rejectionCode })
  });
  loadQueue();
  document.getElementById("reviewPanel").innerHTML = `<div class="panel">Select a submission from the queue to begin review.</div>`;
}

// ---------- Payouts (Finance Lead) ----------
async function loadPayouts() {
  const res = await fetch(`${API_BASE}/api/finance-lead/payouts?status=PENDING`, { headers: authHeaders() });
  if (res.status === 401) {
    document.getElementById("reviewPanel").innerHTML = `<div class="panel" style="border:2px solid var(--danger);">
      <h3>Payouts require Finance Lead role</h3>
      <p>Your account is <b>${role}</b>. Log in with a <b>finance_lead</b> user to see and process payouts.</p>
    </div>`;
    return;
  }
  const data = await res.json();
  if (!res.ok) {
    document.getElementById("reviewPanel").innerHTML = `<div class="panel"><b>Error:</b> ${data.error || res.status}</div>`;
    return;
  }
  lastPayouts = data.payouts || [];
  const eligible = data.eligible || [];
  const threshold = data.threshold || 1000;
  const apiVer = data.apiVersion || "(old API — redeploy Worker)";
  const list = document.getElementById("queueList");
  list.innerHTML = `
    <div style="padding:14px 16px;">
      <div style="font-weight:600;margin-bottom:4px;">Pending Payouts (${lastPayouts.length})</div>
      <div class="muted" style="margin-bottom:6px;">Threshold: LKR ${threshold}</div>
      <div class="muted" style="margin-bottom:8px;font-size:0.75rem;">API: ${apiVer}</div>
      <button class="btn btn-secondary" style="width:100%;padding:8px;" onclick="loadPayouts()">↻ Sync &amp; refresh</button>
      <button class="btn btn-secondary" style="width:100%;padding:8px;margin-top:6px;" onclick="exportPayoutsCsv()">Download CSV</button>
    </div>
  `;

  const eligibleHtml = eligible.length
    ? `<div class="panel" style="border:2px solid #1a6b3c;">
        <h3>Wallets ≥ LKR ${threshold} (${eligible.length})</h3>
        <p class="muted">These balances are at/over threshold. Opening this tab creates pending payout rows automatically.</p>
        ${eligible.map(e => `
          <div class="metric-row">
            <span>${e.mobile_number} <span class="muted">(${e.wallet_status})</span></span>
            <span><b>LKR ${Number(e.balance_lkr).toFixed(2)}</b>
              ${e.pending_payouts ? " · pending payout ✓" : " · no payout row yet"}
              ${e.has_bank ? " · bank ✓" : " · <span style=\"color:var(--danger)\">no bank</span>"}
            </span>
          </div>`).join("")}
      </div>`
    : `<div class="panel"><h3>No wallets ≥ LKR ${threshold}</h3>
        <p class="muted">Payouts only appear after claims are <b>Approved</b> and the customer wallet balance reaches the threshold.
        Having many customers in Customer Master is not enough — they need approved claim rewards in the wallet.</p>
        <p class="muted">API version: <code>${apiVer}</code> — if this does not say <code>2026-09-24-payout-sync</code>, the Worker is still running old code.</p>
      </div>`;

  const payoutsHtml = lastPayouts.length
    ? lastPayouts.map(p => `
        <div class="payout-card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <div style="font-weight:700;">${p.mobile_number}</div>
              <div class="muted" style="font-size:0.85rem;">Requested ${new Date(p.created_at).toLocaleString()} · ${p.approved_claims || 0} approved claims
                ${p.wallet_balance != null ? " · wallet LKR " + Number(p.wallet_balance).toFixed(2) : ""}</div>
            </div>
            <div style="font-size:1.3rem;font-weight:700;">LKR ${Number(p.amount_lkr).toFixed(2)}</div>
          </div>
          <div class="bank-info">
            ${p.account_name
              ? `<b>${p.account_name}</b> — ${p.bank_name}${p.branch_name ? " (" + p.branch_name + ")" : ""}<br>${p.account_number}`
              : `<span style="color:var(--danger);">⚠️ Customer has not submitted bank details yet.</span>`}
          </div>
          <div>
            <input type="text" placeholder="ERP Reference" id="erp-${p.id}" />
            <input type="text" placeholder="Bank Outgoing Ref" id="bankref-${p.id}" />
            <button class="btn btn-approve" style="width:auto;padding:9px 16px;" onclick="bindPayout(${p.id})" ${p.account_name ? "" : "disabled"}>
              Mark Paid
            </button>
          </div>
        </div>
      `).join("")
    : `<div class="panel">No pending payout rows yet. See eligible wallets above.</div>`;

  document.getElementById("reviewPanel").innerHTML = eligibleHtml + payoutsHtml;
}

function csvEscape(v) {
  const s = v == null ? "" : String(v);
  if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
}

function downloadCsv(filename, rows) {
  const bom = "\uFEFF";
  const text = bom + rows.map(r => r.map(csvEscape).join(",")).join("\n");
  const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function exportPayoutsCsv() {
  const header = ["id", "mobile_number", "amount_lkr", "status", "account_name", "account_number", "bank_name", "branch_name", "approved_claims", "created_at", "erp_reference", "bank_reference"];
  const rows = [header, ...lastPayouts.map(p => header.map(k => p[k] ?? ""))];
  downloadCsv(`payouts-${new Date().toISOString().slice(0, 10)}.csv`, rows);
  await fetch(`${API_BASE}/api/finance-lead/payouts/export-log`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ format: "csv", rows: lastPayouts.length })
  }).catch(() => {});
}

async function exportPayoutsExcel() {
  // Same CSV with BOM — opens cleanly in Excel
  await exportPayoutsCsv();
}

async function bindPayout(payoutId) {
  const erpReference = document.getElementById(`erp-${payoutId}`).value.trim();
  const bankReference = document.getElementById(`bankref-${payoutId}`).value.trim();
  if (!erpReference || !bankReference) { alert("Both ERP reference and bank reference are required."); return; }

  const res = await fetch(`${API_BASE}/api/finance-lead/payouts/${payoutId}/bind`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ erpReference, bankReference })
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error); return; }
  loadPayouts();
}

if (token) showApp();
</script>
