<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Panel</title>
<style>
  :root { --primary: #1a6b3c; --danger: #b91c1c; --bg: #f3f4f6; --card: #fff; --border: #e2e5e4; --muted: #6b7280; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--card); padding: 0 20px; }
  .tab { padding: 14px 18px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .content { padding: 20px; max-width: 900px; margin: 0 auto; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .panel h3 { margin: 0 0 12px; font-size: 1rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; }
  th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
  .role-badge { padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: #eef2ff; color: #3730a3; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status-dot.active { background: #16a34a; } .status-dot.inactive { background: #9ca3af; }
  .row-actions a { font-size: 0.8rem; color: var(--primary); cursor: pointer; margin-right: 10px; text-decoration: none; }
  .row-actions a.danger { color: var(--danger); }
  input, select { padding: 9px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; }
  .form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .form-row input, .form-row select { flex: 1; min-width: 140px; }
  button { padding: 9px 16px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
  button.secondary { background: #374151; }
  #loginOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; }
  #loginBox { background: #fff; padding: 24px; border-radius: 12px; width: 300px; }
  #loginBox input { width: 100%; margin-bottom: 10px; }
  #loginBox button { width: 100%; }
  .msg { font-size: 0.85rem; margin-top: 6px; }
  .msg.err { color: var(--danger); } .msg.ok { color: var(--primary); }
  .app-header { background: var(--primary); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
  .app-header h2 { margin: 0; font-size: 1.05rem; font-weight: 700; }
  .app-header nav a { color: #fff; opacity: 0.85; text-decoration: none; font-size: 0.9rem; margin-left: 14px; }
  .app-header .spacer { flex: 1; }
  .app-header .who { font-size: 0.85rem; opacity: 0.9; margin-right: 10px; }
  .app-header button.logout { background: rgba(255,255,255,0.15); color: #fff; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stat-card .num { font-size: 1.6rem; font-weight: 700; }
  .stat-card .label { color: var(--muted); font-size: 0.8rem; }
  .qr-preview { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; margin-top: 14px; }
  .qr-preview .qr-box { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: #fff; }
  .qr-preview .qr-actions { display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body>

<div id="loginOverlay">
  <div id="loginBox">
    <h3>Admin Login</h3>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button id="loginBtn">Sign In</button>
    <div id="loginError" class="msg err"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="app-header">
    <h2>🛠️ Admin Panel <span style="font-size:0.7rem;opacity:0.75;font-weight:500;">v2026-09-24</span></h2>
    <nav><a href="/finance.html">Finance Dashboard →</a></nav>
    <div class="spacer"></div>
    <span class="who" id="whoLabel"></span>
    <button class="logout" id="logoutBtn">Log out</button>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="overview">Overview</div>
    <div class="tab" data-tab="staff">Staff Accounts</div>
    <div class="tab" data-tab="customers">Customer Master</div>
    <div class="tab" data-tab="items">Item Master</div>
    <div class="tab" data-tab="rates">Payout Rates</div>
    <div class="tab" data-tab="qr">QR / URL Assets</div>
  </div>
  <div class="content">
    <div id="tab-overview"></div>
    <div id="tab-staff" style="display:none;"></div>
    <div id="tab-customers" style="display:none;"></div>
    <div id="tab-items" style="display:none;"></div>
    <div id="tab-rates" style="display:none;"></div>
    <div id="tab-qr" style="display:none;"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

<script src="/config.js"></script>
<script>
const API_BASE = window.API_BASE || "";
let token = localStorage.getItem("adminToken") || null;
let currentUsername = null;

document.getElementById("loginBtn").addEventListener("click", async () => {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const res = await fetch(`${API_BASE}/api/auth/login`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();
  if (!res.ok) { document.getElementById("loginError").textContent = data.error; return; }
  if (data.role !== "admin") { document.getElementById("loginError").textContent = "This account does not have admin access."; return; }
  token = data.token;
  currentUsername = username;
  localStorage.setItem("adminToken", token);
  localStorage.setItem("adminUsername", username);
  showApp();
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("adminToken");
  localStorage.removeItem("adminUsername");
  location.reload();
});

function authHeaders() {
  return { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" };
}

function showApp() {
  document.getElementById("loginOverlay").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("whoLabel").textContent = localStorage.getItem("adminUsername") || "";
  loadOverview();
  loadStaff();
  loadRates();
  loadCustomers();
  loadItems();
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    ["overview", "staff", "customers", "items", "rates", "qr"].forEach(name => {
      document.getElementById(`tab-${name}`).style.display = name === tab.dataset.tab ? "block" : "none";
    });
    if (tab.dataset.tab === "overview") loadOverview();
    if (tab.dataset.tab === "qr") loadQrTab();
  });
});

// ============================================================
// Overview
// ============================================================
async function loadOverview() {
  const res = await fetch(`${API_BASE}/api/top-customers?limit=10`, { headers: authHeaders() });
  const data = res.ok ? await res.json() : { customers: [] };
  const customers = data.customers || [];

  const totalSubmissions = customers.reduce((sum, c) => sum + c.submission_count, 0);
  const totalApproved = customers.reduce((sum, c) => sum + (c.total_approved_lkr || 0), 0);

  const rows = customers.map(c => `
    <tr>
      <td>${c.dealer_name || "—"}</td>
      <td>${c.mobile_number}</td>
      <td>${c.submission_count}</td>
      <td>LKR ${(c.total_approved_lkr || 0).toFixed(2)}</td>
      <td>${new Date(c.last_submission).toLocaleDateString()}</td>
    </tr>
  `).join("");

  document.getElementById("tab-overview").innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${customers.length}</div><div class="label">Active customers</div></div>
      <div class="stat-card"><div class="num">${totalSubmissions}</div><div class="label">Total submissions (top 10)</div></div>
      <div class="stat-card"><div class="num">LKR ${totalApproved.toFixed(0)}</div><div class="label">Approved rewards (top 10)</div></div>
    </div>
    <div class="panel">
      <h3>Top Submitted Customers</h3>
      <table>
        <thead><tr><th>Dealer</th><th>Mobile</th><th>Submissions</th><th>Approved Reward</th><th>Last Submission</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="5" style="color:var(--muted);">No submissions yet.</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

// ============================================================
// Staff Accounts
// ============================================================
async function loadStaff() {
  const res = await fetch(`${API_BASE}/api/admin/staff`, { headers: authHeaders() });
  if (res.status === 401) { localStorage.removeItem("adminToken"); location.reload(); return; }
  const data = await res.json();
  renderStaff(data.staff);
}

function renderStaff(staff) {
  const rows = staff.map(s => `
    <tr>
      <td>${s.username}</td>
      <td><span class="role-badge">${s.role.replace("_"," ")}</span></td>
      <td><span class="status-dot ${s.active ? "active" : "inactive"}"></span>${s.active ? "Active" : "Inactive"}</td>
      <td class="row-actions">
        <a data-action="reset" data-user="${s.username}">Reset password</a>
        <a data-action="role" data-user="${s.username}" data-current="${s.role}">Change role</a>
        <a data-action="toggle" data-user="${s.username}" data-active="${s.active}" class="${s.active ? "danger" : ""}">
          ${s.active ? "Deactivate" : "Activate"}
        </a>
      </td>
    </tr>
  `).join("");

  document.getElementById("tab-staff").innerHTML = `
    <div class="panel">
      <h3>Create Staff Account</h3>
      <div class="form-row">
        <input type="text" id="newUsername" placeholder="Username" />
        <input type="password" id="newPassword" placeholder="Password (min 8 chars)" />
        <select id="newRole">
          <option value="finance_staff">Finance Staff (Reviewer)</option>
          <option value="finance_lead">Finance Lead (Disbursement)</option>
          <option value="admin">Admin</option>
        </select>
        <button id="createStaffBtn">Create</button>
      </div>
      <div id="createStaffMsg" class="msg"></div>
    </div>
    <div class="panel">
      <h3>Existing Staff</h3>
      <table>
        <thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" style="color:var(--muted);">No staff accounts yet.</td></tr>'}</tbody>
      </table>
    </div>
  `;

  document.getElementById("createStaffBtn").addEventListener("click", createStaff);
  document.querySelectorAll('[data-action="reset"]').forEach(el => el.addEventListener("click", () => resetPassword(el.dataset.user)));
  document.querySelectorAll('[data-action="role"]').forEach(el => el.addEventListener("click", () => changeRole(el.dataset.user, el.dataset.current)));
  document.querySelectorAll('[data-action="toggle"]').forEach(el => el.addEventListener("click", () => toggleActive(el.dataset.user, el.dataset.active === "true")));
}

async function createStaff() {
  const username = document.getElementById("newUsername").value.trim();
  const password = document.getElementById("newPassword").value;
  const role = document.getElementById("newRole").value;
  const msg = document.getElementById("createStaffMsg");

  const res = await fetch(`${API_BASE}/api/admin/staff`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ username, password, role })
  });
  const data = await res.json();
  if (!res.ok) { msg.className = "msg err"; msg.textContent = data.error; return; }
  msg.className = "msg ok"; msg.textContent = "Staff account created.";
  loadStaff();
}

async function resetPassword(username) {
  const password = prompt(`New password for ${username} (min 8 characters):`);
  if (!password) return;
  const res = await fetch(`${API_BASE}/api/admin/staff/${encodeURIComponent(username)}/reset-password`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ password })
  });
  const data = await res.json();
  alert(res.ok ? "Password reset." : data.error);
}

async function changeRole(username, currentRole) {
  const role = prompt(`New role for ${username} (admin / finance_staff / finance_lead):`, currentRole);
  if (!role || role === currentRole) return;
  const res = await fetch(`${API_BASE}/api/admin/staff/${encodeURIComponent(username)}/role`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ role })
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error); return; }
  loadStaff();
}

async function toggleActive(username, isActive) {
  if (!confirm(`${isActive ? "Deactivate" : "Activate"} ${username}?`)) return;
  const res = await fetch(`${API_BASE}/api/admin/staff/${encodeURIComponent(username)}/active`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ active: !isActive })
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error); return; }
  loadStaff();
}

// ============================================================
// Customer Master (B2B Dealers)
// ============================================================
async function loadCustomers() {
  const res = await fetch(`${API_BASE}/api/admin/dealers`, { headers: authHeaders() });
  const data = await res.json();
  renderCustomers(data.dealers || []);
}

function renderCustomers(dealers) {
  const rows = dealers.map(d => `
    <tr>
      <td>${d.customer_code || "—"}</td>
      <td>${d.name}</td>
      <td>${d.contact_phone || "—"}</td>
      <td>${d.city || "—"}</td>
      <td><span class="status-dot ${d.active ? "active" : "inactive"}"></span>${d.active ? "Active" : "Inactive"}</td>
      <td class="row-actions">
        <a onclick='editCustomer(${JSON.stringify(d).replace(/'/g, "&apos;")})'>Edit</a>
        ${d.active ? `<a class="danger" onclick="deleteCustomer('${d.id}')">Delete</a>` : ""}
      </td>
    </tr>
  `).join("");

  document.getElementById("tab-customers").innerHTML = `
    <div class="panel">
      <h3>Add / Bulk Upload B2B Customers</h3>
      <div class="form-row">
        <input type="text" id="custCode" placeholder="Customer Code" />
        <input type="text" id="custName" placeholder="Customer / Dealer Name" />
        <input type="text" id="custPhone" placeholder="Contact Phone" />
      </div>
      <div class="form-row">
        <input type="text" id="custAddress" placeholder="Address" />
        <input type="text" id="custCity" placeholder="City" />
      </div>
      <div class="form-row">
        <input type="text" id="custLocation" placeholder="Location: paste Google Maps link or lat, lng (e.g. 6.9271, 79.8612)" style="flex:1;min-width:280px;" />
      </div>
      <div class="form-row">
        <button onclick="createCustomer()">Add Customer</button>
        <label class="secondary" style="display:inline-flex;align-items:center;gap:6px;padding:9px 14px;background:#374151;color:#fff;border-radius:8px;cursor:pointer;">
          Upload Excel / CSV
          <input type="file" id="custExcelInput" accept=".xlsx,.xls,.csv" style="display:none;" />
        </label>
      </div>
      <div id="custMsg" class="msg"></div>
      <p style="color:var(--muted);font-size:0.85rem;">
        <b>Location is optional.</b> Paste a Google Maps share link or <code>latitude, longitude</code> — no need to split lat/lng columns.
        Excel/CSV headers: <code>customerCode, name, contactPhone, address, city, location</code>
        (or legacy <code>latitude, longitude</code>). Rows without a recognised location are still saved; geofence will be skipped for them.
      </p>
    </div>
    <div class="panel">
      <h3>Customer Master (${dealers.length})</h3>
      <table>
        <thead><tr><th>Code</th><th>Name</th><th>Phone</th><th>City</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" style="color:var(--muted);">No customers yet.</td></tr>'}</tbody>
      </table>
    </div>
  `;

  document.getElementById("custExcelInput").addEventListener("change", (e) => handleBulkUpload(e, "dealers"));
}

async function createCustomer() {
  const body = {
    customerCode: document.getElementById("custCode").value.trim() || undefined,
    name: document.getElementById("custName").value.trim(),
    contactPhone: document.getElementById("custPhone").value.trim() || undefined,
    address: document.getElementById("custAddress").value.trim() || undefined,
    city: document.getElementById("custCity").value.trim() || undefined,
    location: document.getElementById("custLocation").value.trim() || undefined,
  };
  const msg = document.getElementById("custMsg");
  if (!body.name) { msg.className = "msg err"; msg.textContent = "Customer name is required."; return; }

  const res = await fetch(`${API_BASE}/api/admin/dealers`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok) { msg.className = "msg err"; msg.textContent = data.error; return; }
  const locNote = data.latitude != null ? ` (location: ${data.latitude.toFixed(5)}, ${data.longitude.toFixed(5)})` : " (no coordinates)";
  msg.className = "msg ok"; msg.textContent = "Customer added." + locNote;
  loadCustomers();
}

function editCustomer(dealer) {
  const name = prompt("Customer name:", dealer.name);
  if (name === null) return;
  const contactPhone = prompt("Contact phone:", dealer.contact_phone || "");
  const city = prompt("City:", dealer.city || "");
  fetch(`${API_BASE}/api/admin/dealers/${dealer.id}`, {
    method: "PATCH", headers: authHeaders(), body: JSON.stringify({ name, contactPhone, city })
  }).then(() => loadCustomers());
}

async function deleteCustomer(id) {
  if (!confirm("Deactivate this customer? Historical submissions are kept.")) return;
  await fetch(`${API_BASE}/api/admin/dealers/${id}`, { method: "DELETE", headers: authHeaders() });
  loadCustomers();
}

// ============================================================
// Item Master (Products)
// ============================================================
async function loadItems() {
  const res = await fetch(`${API_BASE}/api/admin/products`, { headers: authHeaders() });
  const data = await res.json();
  renderItems(data.products || []);
}

function renderItems(products) {
  const rows = products.map(p => `
    <tr>
      <td>${p.id}</td>
      <td>${p.name}</td>
      <td>${p.unit_label}</td>
      <td>LKR ${p.current_rate ?? 0}</td>
      <td><span class="status-dot ${p.active ? "active" : "inactive"}"></span>${p.active ? "Active" : "Inactive"}</td>
      <td class="row-actions">
        <a onclick='editItem(${JSON.stringify(p).replace(/'/g, "&apos;")})'>Edit</a>
        ${p.active ? `<a class="danger" onclick="deleteItem('${p.id}')">Delete</a>` : ""}
      </td>
    </tr>
  `).join("");

  document.getElementById("tab-items").innerHTML = `
    <div class="panel">
      <h3>Add / Bulk Upload Items</h3>
      <div class="form-row">
        <input type="text" id="itemCode" placeholder="Item Code" />
        <input type="text" id="itemName" placeholder="Item Name (e.g. Wall Putty 25kg)" />
        <input type="text" id="itemUnit" placeholder="Unit Label (default: bag)" />
        <input type="number" step="0.01" id="itemRate" placeholder="Reward Rate (LKR)" />
      </div>
      <div class="form-row">
        <button onclick="createItem()">Add Item</button>
        <label class="secondary" style="display:inline-flex;align-items:center;gap:6px;padding:9px 14px;background:#374151;color:#fff;border-radius:8px;cursor:pointer;">
          Upload Excel (.xlsx)
          <input type="file" id="itemExcelInput" accept=".xlsx,.xls,.csv" style="display:none;" />
        </label>
      </div>
      <div id="itemMsg" class="msg"></div>
      <p style="color:var(--muted);font-size:0.85rem;">
        Excel columns (header row required): <code>itemCode, name, unitLabel, rate</code>.
        Matches existing items by <code>itemCode</code> and updates them (including rate, if changed); new codes are created.
      </p>
    </div>
    <div class="panel">
      <h3>Item Master (${products.length})</h3>
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Unit</th><th>Current Rate</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" style="color:var(--muted);">No items yet.</td></tr>'}</tbody>
      </table>
    </div>
  `;

  document.getElementById("itemExcelInput").addEventListener("change", (e) => handleBulkUpload(e, "items"));
}

async function createItem() {
  const body = {
    itemCode: document.getElementById("itemCode").value.trim() || undefined,
    name: document.getElementById("itemName").value.trim(),
    unitLabel: document.getElementById("itemUnit").value.trim() || undefined,
    rate: parseFloat(document.getElementById("itemRate").value) || undefined,
  };
  const msg = document.getElementById("itemMsg");
  if (!body.name) { msg.className = "msg err"; msg.textContent = "Item name is required."; return; }

  const res = await fetch(`${API_BASE}/api/admin/items`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok) { msg.className = "msg err"; msg.textContent = data.error; return; }
  msg.className = "msg ok"; msg.textContent = "Item added.";
  loadItems();
  loadRates();
}

function editItem(product) {
  const name = prompt("Item name:", product.name);
  if (name === null) return;
  const unitLabel = prompt("Unit label:", product.unit_label);
  fetch(`${API_BASE}/api/admin/items/${product.id}`, {
    method: "PATCH", headers: authHeaders(), body: JSON.stringify({ name, unitLabel })
  }).then(() => { loadItems(); loadRates(); });
}

async function deleteItem(id) {
  if (!confirm("Deactivate this item? Historical submissions are kept.")) return;
  await fetch(`${API_BASE}/api/admin/items/${id}`, { method: "DELETE", headers: authHeaders() });
  loadItems();
  loadRates();
}

// ============================================================
// Excel bulk upload (shared: dealers | items)
// ============================================================
function handleBulkUpload(event, kind) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async (e) => {
    const workbook = XLSX.read(e.target.result, { type: "array" });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(sheet, { defval: "" });

    const rows = kind === "dealers"
      ? raw.map(r => ({
          customerCode: String(r.customerCode || r.CustomerCode || "").trim(),
          name: String(r.name || r.Name || "").trim(),
          contactPhone: String(r.contactPhone || r.ContactPhone || "").trim() || undefined,
          address: String(r.address || r.Address || "").trim() || undefined,
          city: String(r.city || r.City || "").trim() || undefined,
          // Prefer single "location" column (Maps link or "lat, lng"); fall back to separate lat/lng
          location: String(r.location || r.Location || r.mapsLink || r.MapsLink || "").trim() || undefined,
          latitude: parseFloat(r.latitude || r.Latitude) || undefined,
          longitude: parseFloat(r.longitude || r.Longitude) || undefined,
        }))
      : raw.map(r => ({
          itemCode: String(r.itemCode || r.ItemCode || "").trim(),
          name: String(r.name || r.Name || "").trim(),
          unitLabel: String(r.unitLabel || r.UnitLabel || "").trim() || undefined,
          rate: r.rate !== undefined && r.rate !== "" ? parseFloat(r.rate || r.Rate) : undefined,
        }));

    const endpoint = kind === "dealers" ? "/api/admin/dealers/bulk" : "/api/admin/items/bulk";
    const msgEl = document.getElementById(kind === "dealers" ? "custMsg" : "itemMsg");
    msgEl.className = "msg"; msgEl.textContent = `Uploading ${rows.length} rows…`;

    const res = await fetch(`${API_BASE}${endpoint}`, {
      method: "POST", headers: authHeaders(), body: JSON.stringify({ rows })
    });
    const data = await res.json();
    if (!res.ok) { msgEl.className = "msg err"; msgEl.textContent = data.error || "Upload failed."; return; }

    const warnN = data.warnings?.length || 0;
    msgEl.className = data.errors?.length ? "msg err" : "msg ok";
    msgEl.textContent = `Created ${data.created}, updated ${data.updated}` +
      (data.errors?.length ? `, ${data.errors.length} row(s) skipped` : "") +
      (warnN ? `, ${warnN} location warning(s)` : "") + ".";
    if (data.errors?.length) console.warn("Bulk upload row errors:", data.errors);
    if (data.warnings?.length) console.warn("Bulk upload location warnings:", data.warnings);

    if (kind === "dealers") loadCustomers(); else { loadItems(); loadRates(); }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = ""; // allow re-selecting the same file later
}

// ============================================================
// Payout Rates
// ============================================================
async function loadRates() {
  const res = await fetch(`${API_BASE}/api/admin/products`, { headers: authHeaders() });
  const data = await res.json();
  const rows = (data.products || []).map(p => `
    <tr>
      <td>${p.name}</td>
      <td>LKR ${p.current_rate ?? 0} / ${p.unit_label}</td>
      <td>
        <input type="number" step="0.01" id="rate-${p.id}" placeholder="New rate" style="width:110px;" />
        <button class="secondary" data-product="${p.id}" onclick="updateRate('${p.id}')">Update</button>
      </td>
    </tr>
  `).join("");
  document.getElementById("tab-rates").innerHTML = `
    <div class="panel">
      <h3>Reward Payout Rates</h3>
      <table>
        <thead><tr><th>Product</th><th>Current Rate</th><th>Update</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

async function updateRate(productId) {
  const input = document.getElementById(`rate-${productId}`);
  const rate = parseFloat(input.value);
  if (isNaN(rate) || rate < 0) { alert("Enter a valid rate."); return; }
  const res = await fetch(`${API_BASE}/api/admin/products/${productId}/rate`, {
    method: "POST", headers: authHeaders(), body: JSON.stringify({ rate })
  });
  if (res.ok) loadRates(); else alert("Failed to update rate.");
}

// ============================================================
// QR / URL Assets — rendered client-side (Level H error correction)
// ============================================================
async function loadQrTab() {
  const historyHtml = await fetchQrHistory();
  document.getElementById("tab-qr").innerHTML = `
    <div class="panel">
      <h3>Generate Common Access QR / URL Asset</h3>
      <div class="form-row">
        <select id="qrType">
          <option value="upload">Upload Portal QR</option>
          <option value="track">Tracking Portal QR</option>
        </select>
        <input type="text" id="qrTargetUrl" placeholder="Target URL, e.g. https://rewards.company.com/upload" />
        <button onclick="generateQr()">Generate QR</button>
      </div>
      <div id="qrMsg" class="msg"></div>
      <div id="qrPreview"></div>
    </div>
    <div class="panel">
      <h3>Recent Requests</h3>
      <table>
        <thead><tr><th>Type</th><th>Target URL</th><th>Requested</th><th></th></tr></thead>
        <tbody>${historyHtml}</tbody>
      </table>
    </div>
  `;
}

async function fetchQrHistory() {
  const res = await fetch(`${API_BASE}/api/admin/qr-assets`, { headers: authHeaders() });
  if (!res.ok) return '<tr><td colspan="4" style="color:var(--muted);">Could not load history.</td></tr>';
  const data = await res.json();
  if (!data.assets?.length) return '<tr><td colspan="4" style="color:var(--muted);">No requests yet.</td></tr>';
  return data.assets.map(a => `
    <tr>
      <td>${a.asset_type}</td>
      <td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.target_url}</td>
      <td>${new Date(a.created_at).toLocaleString()}</td>
      <td><a onclick="renderQr('${a.target_url.replace(/'/g, "&apos;")}')" style="cursor:pointer;color:var(--primary);">Re-render</a></td>
    </tr>
  `).join("");
}

async function generateQr() {
  const assetType = document.getElementById("qrType").value;
  const targetUrl = document.getElementById("qrTargetUrl").value.trim();
  const msg = document.getElementById("qrMsg");
  if (!targetUrl) { msg.className = "msg err"; msg.textContent = "Enter a target URL."; return; }

  // Log the request for the audit trail (system_audit_log + qr_assets).
  await fetch(`${API_BASE}/api/admin/qr-assets`, {
    method: "POST", headers: authHeaders(),
    body: JSON.stringify({ assetType, targetUrl, format: "svg" })
  });

  msg.className = "msg ok";
  msg.textContent = "Generated below — download the format you need.";
  renderQr(targetUrl);
  loadQrTab(); // refresh history table in the background on next tab visit
}

function renderQr(targetUrl) {
  // Level H = highest error correction, per SRS §3 (durable on printed bag flaps).
  const qr = qrcode(0, "H"); // typeNumber 0 = auto-detect smallest size that fits
  qr.addData(targetUrl);
  qr.make();

  const cellSize = 6;
  const margin = 4;
  const svgMarkup = qr.createSvgTag(cellSize, margin);

  const preview = document.getElementById("qrPreview");
  preview.innerHTML = `
    <div class="qr-preview">
      <div class="qr-box" id="qrSvgHolder">${svgMarkup}</div>
      <div class="qr-actions">
        <button onclick="downloadQrSvg('${targetUrl.replace(/'/g, "&apos;")}')">Download SVG (factory print)</button>
        <button class="secondary" onclick="downloadQrPng('${targetUrl.replace(/'/g, "&apos;")}')">Download PNG (marketing/dealer)</button>
        <button class="secondary" onclick="printQrPdf()">Print / Save as PDF</button>
      </div>
    </div>
  `;
}

function downloadQrSvg(targetUrl) {
  const qr = qrcode(0, "H");
  qr.addData(targetUrl);
  qr.make();
  const svgMarkup = qr.createSvgTag(8, 4);
  const blob = new Blob([svgMarkup], { type: "image/svg+xml" });
  triggerDownload(blob, "reward-qr.svg");
}

function downloadQrPng(targetUrl) {
  const qr = qrcode(0, "H");
  qr.addData(targetUrl);
  qr.make();
  const cellSize = 8;
  const moduleCount = qr.getModuleCount();
  const size = moduleCount * cellSize;

  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = "#000000";
  for (let row = 0; row < moduleCount; row++) {
    for (let col = 0; col < moduleCount; col++) {
      if (qr.isDark(row, col)) ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
    }
  }
  canvas.toBlob((blob) => triggerDownload(blob, "reward-qr.png"));
}

function printQrPdf() {
  const svgHolder = document.getElementById("qrSvgHolder");
  if (!svgHolder) return;
  const win = window.open("", "_blank");
  win.document.write(`
    <html><head><title>Print QR</title></head>
    <body style="display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
      ${svgHolder.innerHTML}
    </body></html>
  `);
  win.document.close();
  win.focus();
  win.print();
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

if (token) showApp();
</script>
