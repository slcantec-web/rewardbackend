<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Track Your Claim</title>
<style>
  :root { --primary: #1a6b3c; --bg: #f5f7f6; --card: #fff; --border: #e2e5e4; --muted: #6b7280; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding-bottom: 16px; }
  .app-header { background: var(--primary); color: #fff; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px; display: flex; align-items: center; gap: 10px; }
  .app-header .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: 0.85; }
  .app-header h2 { margin: 0; font-size: 1.05rem; font-weight: 700; }
  .app-header .tagline { font-size: 0.75rem; opacity: 0.85; margin-left: auto; }
  .page-body { padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; font-size: 1rem; }
  button { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .status-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
  .status-PENDING, .status-IN_REVIEW { background: #fef3c7; color: #92400e; }
  .status-APPROVED { background: #dcfce7; color: #166534; }
  .status-REJECTED { background: #fee2e2; color: #991b1b; }
  .item-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .progress-track { background: #e5e7eb; border-radius: 999px; height: 10px; overflow: hidden; margin-top: 6px; }
  .progress-fill { background: var(--primary); height: 100%; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .bank-form input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; font-size: 0.95rem; }
  .bank-form button { width: 100%; padding: 11px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .banner-warn { background: #fef3c7; color: #92400e; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 10px; }
  .banner-ok { background: #dcfce7; color: #166534; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="app-header">
  <span class="logo-dot"></span>
  <h2>CanTec Rewards</h2>
  <span class="tagline">Track Your Claim</span>
</div>

<div class="page-body">

<div class="card">
  <h1>Track Your Claim</h1>
  <input type="text" id="mobileInput" placeholder="Mobile Number" />
  <input type="text" id="submissionIdInput" placeholder="Submission ID (e.g. SUB-2026-89412)" />
  <button id="trackBtn">Check Status</button>
</div>

<div id="resultCard" style="display:none;"></div>

</div>

<script src="/config.js"></script>
<script>
let lastMobile = null;
let lastSubmissionId = null;

document.getElementById("trackBtn").addEventListener("click", async () => {
  const mobile = document.getElementById("mobileInput").value.trim();
  const submissionId = document.getElementById("submissionIdInput").value.trim();
  const resultCard = document.getElementById("resultCard");
  if (!mobile || !submissionId) return;
  lastMobile = mobile;
  lastSubmissionId = submissionId;

  const res = await fetch(`${window.API_BASE || ""}/api/track?mobile=${encodeURIComponent(mobile)}&submissionId=${encodeURIComponent(submissionId)}`);
  const data = await res.json();

  resultCard.style.display = "block";
  if (!res.ok) {
    resultCard.innerHTML = `<div class="card">⚠️ ${data.error || "Claim not found"}</div>`;
    return;
  }

  const s = data.submission;
  const itemsHtml = data.items.map(i =>
    `<div class="item-row"><span>${i.name}</span><span>Claimed: ${i.claimed_qty}${i.verified_qty != null ? " | Verified: " + i.verified_qty : ""}</span></div>`
  ).join("");

  const threshold = 1000;
  const pct = Math.min(100, Math.round((data.wallet.balance_lkr / threshold) * 100));

  resultCard.innerHTML = `
    <div class="card">
      <div class="muted">Submission ID</div>
      <div><b>${s.id}</b></div>
      <div class="muted" style="margin-top:8px;">Status</div>
      <span class="status-badge status-${s.status}">${s.status.replace("_"," ")}</span>
    </div>
    <div class="card">
      <div class="muted" style="margin-bottom:6px;">Submitted Items</div>
      ${itemsHtml}
    </div>
    <div class="card">
      <div class="muted">Wallet Balance</div>
      <div style="font-size:1.4rem;font-weight:700;">${data.wallet.balance_lkr.toFixed(2)} LKR</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="muted" style="margin-top:4px;">${pct}% to ${threshold} LKR minimum withdrawal</div>
    </div>
    <div id="bankCard"></div>
  `;

  if (data.wallet.status === "PENDING_PAYOUT") {
    loadBankDetails();
  }
});

async function loadBankDetails() {
  const res = await fetch(`${window.API_BASE || ""}/api/track/bank-details?mobile=${encodeURIComponent(lastMobile)}&submissionId=${encodeURIComponent(lastSubmissionId)}`);
  const data = await res.json();
  const bankCard = document.getElementById("bankCard");
  const d = data.details || {};

  // Prefill from previously saved details for this mobile number — customer does not re-enter everything.
  const has = !!data.hasDetails;
  bankCard.innerHTML = `
    <div class="card">
      ${has
        ? `<div class="banner-ok">✅ Bank details are on file for this mobile number. Finance will process your payment shortly. You can update them below if needed.</div>
           <div class="muted">On file</div>
           <div style="margin-bottom:10px;">${d.account_name} — ${d.bank_name}${d.branch_name ? " (" + d.branch_name + ")" : ""} · ${d.account_number}</div>`
        : `<div class="banner-warn">⚠️ Your reward has reached the payout threshold. Please add your bank details so Finance can send your payment.</div>`}
      <div class="bank-form">
        <input type="text" id="bankAccountName" placeholder="Account Holder Name" value="${has ? (d.account_name || "").replace(/"/g, "&quot;") : ""}" />
        <input type="text" id="bankAccountNumber" placeholder="${has ? "Account Number (leave blank to keep current)" : "Account Number"}" />
        <input type="text" id="bankName" placeholder="Bank Name" value="${has ? (d.bank_name || "").replace(/"/g, "&quot;") : ""}" />
        <input type="text" id="bankBranch" placeholder="Branch (optional)" value="${has ? (d.branch_name || "").replace(/"/g, "&quot;") : ""}" />
        <button id="saveBankBtn">${has ? "Update Bank Details" : "Submit Bank Details"}</button>
        <div id="bankMsg" class="muted" style="margin-top:6px;"></div>
      </div>
    </div>
  `;

  document.getElementById("saveBankBtn").addEventListener("click", async () => {
    const body = {
      mobile: lastMobile,
      submissionId: lastSubmissionId,
      accountName: document.getElementById("bankAccountName").value.trim(),
      accountNumber: document.getElementById("bankAccountNumber").value.trim() || undefined,
      bankName: document.getElementById("bankName").value.trim(),
      branchName: document.getElementById("bankBranch").value.trim() || undefined,
    };
    const msg = document.getElementById("bankMsg");
    // On update, account number can be blank (keeps existing). On first submit it is required.
    if (!body.accountName || !body.bankName || (!has && !body.accountNumber)) {
      msg.textContent = has
        ? "Account name and bank name are required."
        : "Account name, number, and bank name are required.";
      return;
    }
    const res = await fetch(`${window.API_BASE || ""}/api/track/bank-details`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) { msg.textContent = data.error; return; }
    loadBankDetails();
  });
}
</script>
</body>
</html>
