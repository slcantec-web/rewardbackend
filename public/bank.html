<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CanTec Rewards — Add Bank Details for Payout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --muted: #64748b;
      --text: #0f172a;
      --danger: #dc2626;
      --success: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .app-header {
      background: #0f172a; color: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 12px;
    }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px; background: var(--primary);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: "Plus Jakarta Sans", sans-serif;
    }
    .page-body { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    }
    h1 { font-family: "Plus Jakarta Sans", sans-serif; font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; }
    .muted { color: var(--muted); font-size: 0.85rem; line-height: 1.45; }
    label { font-size: 0.75rem; font-weight: 600; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.02em; }
    input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 0.95rem; margin-bottom: 12px; font-family: inherit;
    }
    input:focus { outline: 2px solid #bfdbfe; border-color: var(--primary); }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--primary);
      color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; font-family: inherit;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .banner { padding: 12px 14px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 12px; }
    .banner-ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .banner-err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .banner-warn { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .mono { font-family: ui-monospace, monospace; }
    a { color: var(--primary); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="app-header">
    <div class="brand-icon">C</div>
    <div>
      <div style="font-weight:700;font-size:0.95rem;">CanTec Rewards</div>
      <div style="font-size:0.75rem;opacity:0.75;">Bank details for payout</div>
    </div>
  </div>

  <div class="page-body">
    <div class="card">
      <h1>Add your bank account</h1>
      <p class="muted" id="introText">Loading secure link…</p>
    </div>

    <div id="statusBox"></div>
    <div id="formCard" class="card" style="display:none;">
      <label>Account holder name</label>
      <input type="text" id="accountName" placeholder="Name as in bank passbook" autocomplete="name" />

      <label>Bank account number</label>
      <input type="text" id="accountNumber" placeholder="Account number" class="mono" inputmode="numeric" autocomplete="off" />

      <label>Bank name</label>
      <input type="text" id="bankName" placeholder="e.g. Commercial Bank / Sampath Bank" />

      <label>Branch (optional)</label>
      <input type="text" id="branchName" placeholder="e.g. Colombo Fort" />

      <p class="muted" style="margin-bottom:12px;">This account is linked to your mobile only. One mobile = one bank account.</p>
      <button type="button" id="saveBtn">Save bank details</button>
      <div id="formMsg" class="muted" style="margin-top:10px;text-align:center;"></div>
    </div>

    <p style="text-align:center;margin-top:12px;" class="muted">
      <a href="track.html">Track a claim</a> · <a href="index.html">Submit a claim</a>
    </p>
  </div>

  <script src="config.js"></script>
  <script>
    const API_BASE = window.API_BASE || "";
    const params = new URLSearchParams(location.search);
    const token = (params.get("token") || "").trim();

    const intro = document.getElementById("introText");
    const statusBox = document.getElementById("statusBox");
    const formCard = document.getElementById("formCard");

    function showStatus(html, kind) {
      statusBox.innerHTML = `<div class="banner banner-${kind}">${html}</div>`;
    }

    async function loadInvite() {
      if (!token) {
        intro.textContent = "This link is incomplete.";
        showStatus("Missing invite token. Ask Finance to send you a new bank-details link.", "err");
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/public/bank-invite?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!res.ok) {
          intro.textContent = "Unable to open this invite.";
          showStatus(data.error || "Invalid link", data.expired || data.used ? "warn" : "err");
          return;
        }
        intro.innerHTML = `Mobile on file: <b class="mono">${data.mobileMasked || "****"}</b><br>Link valid until ${data.expiresAt ? new Date(data.expiresAt).toLocaleString() : "—"}.`;
        if (data.hasBank) {
          showStatus("Bank details are already registered for this mobile. Finance can proceed with payout.", "ok");
          return;
        }
        formCard.style.display = "block";
      } catch (e) {
        intro.textContent = "Network error.";
        showStatus("Could not reach the server. Try again later.", "err");
      }
    }

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const btn = document.getElementById("saveBtn");
      const msg = document.getElementById("formMsg");
      const body = {
        token,
        accountName: document.getElementById("accountName").value.trim(),
        accountNumber: document.getElementById("accountNumber").value.trim(),
        bankName: document.getElementById("bankName").value.trim(),
        branchName: document.getElementById("branchName").value.trim() || undefined,
      };
      if (!body.accountName || !body.accountNumber || !body.bankName) {
        msg.style.color = "var(--danger)";
        msg.textContent = "Account name, number, and bank name are required.";
        return;
      }
      btn.disabled = true;
      msg.textContent = "Saving…";
      msg.style.color = "var(--muted)";
      try {
        const res = await fetch(`${API_BASE}/api/public/bank-invite`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          msg.style.color = "var(--danger)";
          msg.textContent = data.error || "Save failed";
          btn.disabled = false;
          return;
        }
        formCard.style.display = "none";
        showStatus(data.message || "Bank details saved successfully. You can close this page.", "ok");
      } catch (e) {
        msg.style.color = "var(--danger)";
        msg.textContent = "Network error";
        btn.disabled = false;
      }
    });

    loadInvite();
  </script>
</body>
</html>
